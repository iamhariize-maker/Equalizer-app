name: Device report
description: Tell us whether Svan works on your phone. This is the most useful thing an alpha tester can do.
title: "[Device] <phone model> / Android <version>"
labels: ["device-report", "beta-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Svan is in beta and I'm still working out which phones it behaves on. This takes about a minute.
        Reports that say it didn't work are as useful as ones that say it did.
  - type: input
    id: device
    attributes:
      label: Phone make and model
      placeholder: "TECNO LH7n"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and vendor skin
      placeholder: "Android 14, HiOS"
    validations:
      required: true
  - type: input
    id: svan-version
    attributes:
      label: Svan version
      description: Shown on the release page. Use the exact file name if you are unsure.
      placeholder: "0.5.5"
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Where did this build come from?
      options:
        - Owner-signed GitHub beta
        - Shared-key preview
        - Other or unknown
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Which engine did you use?
      options:
        - System effects
        - Audiophile engine
        - Both, on different apps
        - Not sure
    validations:
      required: true
  - type: input
    id: players
    attributes:
      label: Music or video apps you tried
      placeholder: "YouTube Music, Spotify, VLC"
    validations:
      required: true
  - type: dropdown
    id: output
    attributes:
      label: Audio output
      multiple: true
      options:
        - Phone speaker
        - Wired headphones or USB DAC
        - Bluetooth headphones
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: What happened?
      options:
        - Works well
        - Works, with problems
        - App was not detected or listed
        - Detected but no change in sound
        - Crash or freeze
        - Other
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Details
      description: "Tell me what you heard or saw (delay, echo, crackling, battery drain, anything odd). Only what you actually noticed, please."
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I took anything private out of any logs or screenshots I attached.
          required: true

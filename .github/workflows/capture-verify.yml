# Verify the public engine status after returning it to the visible viewport.
# Verify all assertions on API 34; capture-api33-verify.yml retains the same full API 33 gates on its compatible graphics host.
name: Android 14 frozen capture verification
'on':
  push:
    paths:
    - .github/workflows/capture-verify.yml
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
env:
  SVAN_EMULATOR_BUILD: '16428233'
jobs:
  full-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api:
        - 34
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Verify frozen application source revision
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: test "$(gh api repos/iamhariize-maker/Equalizer-app/actions/runs/37930206322 --jq .head_sha)" = 3dabee6b3bc73bf6391c03b98bb8b0b5f62b2080
    - uses: actions/download-artifact@v4
      with:
        name: app-debug
        path: tested-debug
        run-id: 37930206322
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Enable KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        echo 1 | sudo tee /sys/module/kvm/parameters/ignore_msrs

        '
    - name: Build unchanged synthetic players only
      working-directory: android
      run: ./gradlew --no-daemon :testsource:assembleCapturableDebug :testsource:assembleBlockedDebug
    - name: Download the phone preview for release validation
      uses: actions/download-artifact@v4
      with:
        name: Svan-preview
        path: tested-preview
        run-id: 37930206322
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Use the exact downloadable APK in release tests
      run: 'mkdir -p android/app/build/outputs/apk/release android/app/build/outputs/apk/debug

        cp tested-preview/Svan-preview.apk android/app/build/outputs/apk/release/app-release.apk

        cp tested-debug/app-debug.apk android/app/build/outputs/apk/debug/app-debug.apk'
    - uses: actions/download-artifact@v4
      with:
        name: Svan-production-test-build
        path: tested-production
        run-id: 37930206322
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Prepare output dir
      run: 'mkdir -p e2e-out

        curl -fL --retry 3 https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk -o shizuku.apk

        echo ''6e273ab0e991c4e79bc8b1bbb9b9dd739ccac1a8712a541a214078886b7b790f  shizuku.apk'' | sha256sum -c -

        '
    - name: Verify emulator host audio measurement
      run: 'python3 -m unittest discover -s android/scripts -p test_host_audio_level.py

        '
    - name: Run e2e on emulator
      uses: reactivecircus/android-emulator-runner@v2
      env:
        SHIZUKU_APK: ${{ github.workspace }}/shizuku.apk
        SVAN_ONBOARDING_OUT: ${{ github.workspace }}/e2e-out/onboarding
        QEMU_AUDIO_DRV: wav
        QEMU_WAV_PATH: /tmp/svan-emulator-output.wav
        QEMU_WAV_FREQUENCY: '48000'
        QEMU_WAV_DAC_FIXED_CHANNELS: '2'
        QEMU_WAV_FORMAT: s16
      with:
        api-level: ${{ matrix.api }}
        target: default
        arch: x86_64
        emulator-build: ${{ env.SVAN_EMULATOR_BUILD }}
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader -feature -Vulkan -memory 2048 -cores 2 -no-snapshot -no-boot-anim -camera-back none
        working-directory: android
        script: export PATH="$GITHUB_WORKSPACE/tools/ci:$PATH" ; adb -s emulator-5554 install -r app/build/outputs/apk/debug/app-debug.apk ; adb -s emulator-5554 install -r testsource/build/outputs/apk/capturable/debug/testsource-capturable-debug.apk ; adb -s emulator-5554 install -r testsource/build/outputs/apk/blocked/debug/testsource-blocked-debug.apk ; adb -s emulator-5554 shell wm size 320x640 ; adb -s emulator-5554 shell wm density 160 ; python3 scripts/capture_recovery.py emulator-5554 "$GITHUB_WORKSPACE/e2e-out/capture-recovery" || exit 1 ; bash scripts/production_release.sh emulator-5554 "$GITHUB_WORKSPACE/tested-production/Svan-production-test.apk" "$GITHUB_WORKSPACE/e2e-out/production" || exit 1 ; adb -s emulator-5554 shell am start -W -n app.svan.testsource.blocked/app.svan.testsource.ToneActivity --ez stop true ; adb -s emulator-5554 shell am start -W -n app.svan.testsource.capturable/app.svan.testsource.ToneActivity --ez stop true ; bash scripts/detection_release.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/detection" ; bash scripts/quality_lab.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/quality" || exit 1 ; bash scripts/smoke_release.sh emulator-5554 > "$GITHUB_WORKSPACE/e2e-out/smoke.txt" 2>&1 ; bash scripts/diag.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/diag" ; bash scripts/precision_controls.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/precision" || exit 1 ; bash scripts/e2e.sh emulator-5554 ; bash scripts/source_filter.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/source-filter" || exit 1 ; bash scripts/eq_workspace.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/workspace" ; bash scripts/screens.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/screens" ; cp /tmp/e2e_results.txt /tmp/e2e_eqspike.log /tmp/e2e_eqspike_full.log "$GITHUB_WORKSPACE/e2e-out/" ; bash scripts/basic_detection.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/basic-detection" || exit 1
    - name: Preserve emulator host diagnostics
      if: always()
      run: 'mkdir -p e2e-out

        free -m > e2e-out/host-memory.txt

        sudo dmesg | tail -100 >> e2e-out/host-memory.txt || true

        '
    - name: Results
      if: always()
      run: 'cat e2e-out/smoke.txt || echo "no smoke output"

        cat e2e-out/e2e_results.txt || { echo "no results"; exit 1; }

        grep -q ''^PASS release smoke test'' e2e-out/smoke.txt

        if grep -q ''^FAIL'' e2e-out/e2e_results.txt; then echo ''e2e results contain a failure''; exit 1; fi

        grep -q ''^PASS sound scroll preserves EQ settings'' e2e-out/screens/interaction.txt

        test "$(grep -c ''^PASS setup fixture '' e2e-out/screens/interaction.txt)" -eq 15

        ! grep -q ''^FAIL'' e2e-out/screens/interaction.txt

        cat e2e-out/basic-detection/results.txt

        test "$(grep -c ''^PASS'' e2e-out/basic-detection/results.txt)" -eq 14

        ! grep -q ''^FAIL'' e2e-out/basic-detection/results.txt

        cat e2e-out/capture-recovery/results.txt

        test "$(grep -c ''^PASS'' e2e-out/capture-recovery/results.txt)" -eq 14

        ! grep -q ''^FAIL'' e2e-out/capture-recovery/results.txt

        cat e2e-out/workspace/results.txt

        if grep -q ''^FAIL'' e2e-out/workspace/results.txt; then exit 1; fi

        test "$(grep -c ''^PASS'' e2e-out/workspace/results.txt)" -eq 9

        cat e2e-out/precision/results.txt

        if grep -q ''^FAIL'' e2e-out/precision/results.txt; then exit 1; fi

        test "$(grep -c ''^PASS'' e2e-out/precision/results.txt)" -eq 8

        cat e2e-out/source-filter/results.txt

        test "$(grep -c ''^PASS'' e2e-out/source-filter/results.txt)" -eq 3

        ! grep -q ''^FAIL'' e2e-out/source-filter/results.txt

        cat e2e-out/quality/continuity/results.txt

        test "$(grep -c ''^PASS'' e2e-out/quality/continuity/results.txt)" -eq 4

        ! grep -q ''^FAIL'' e2e-out/quality/continuity/results.txt

        cat e2e-out/quality/results.txt

        if grep -q ''^FAIL'' e2e-out/quality/results.txt; then exit 1; fi

        test "$(grep -c ''^PASS'' e2e-out/quality/results.txt)" -eq 4

        cat e2e-out/production/results.txt

        test "$(grep -c ''^PASS'' e2e-out/production/results.txt)" -eq 8

        ! grep -q ''^FAIL'' e2e-out/production/results.txt

        cat e2e-out/detection/detection.txt

        if grep -q ''^FAIL'' e2e-out/detection/detection.txt; then echo ''release detection results contain a failure''; exit 1; fi

        test "$(grep -c ''^PASS'' e2e-out/detection/detection.txt)" -eq 13

        cat e2e-out/onboarding/results.txt

        test "$(grep -c ''^PASS'' e2e-out/onboarding/results.txt)" -eq 8

        ! grep -q ''^FAIL'' e2e-out/onboarding/results.txt

        cat e2e-out/onboarding/fallbacks/results.txt

        test "$(grep -c ''^PASS'' e2e-out/onboarding/fallbacks/results.txt)" -eq 3

        ! grep -q ''^FAIL'' e2e-out/onboarding/fallbacks/results.txt

        cat e2e-out/detection/onboarding.txt

        test "$(grep -c ''^PASS'' e2e-out/detection/onboarding.txt)" -eq 6

        ! grep -q ''^FAIL'' e2e-out/detection/onboarding.txt

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frozen-capture-api${{ matrix.api }}
        if-no-files-found: warn
        path: e2e-out/

name: CI
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (Release)
        run: |
          cmake -S core -B build/core
          cmake --build build/core -j
          ./build/core/eqcore_tests
      - name: Test with ASan + UBSan
        run: |
          cmake -S core -B build/asan -DEQCORE_SANITIZE=address,undefined -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/asan -j
          ./build/asan/eqcore_tests
      - name: Test with TSan (threaded parameter updates)
        run: |
          cmake -S core -B build/tsan -DEQCORE_SANITIZE=thread -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/tsan -j
          ./build/tsan/eqcore_tests eq_parameter

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Assemble debug APK, lint, unit tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # End-to-end routing test on a KVM-accelerated emulator (GitHub's Linux
  # runners expose /dev/kvm). Results + screenshots are uploaded as artifacts
  # and the results table is printed in the log.
  emulator-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug :testsource:assembleCapturableDebug :testsource:assembleBlockedDebug
      - name: Run e2e on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          # No -noaudio: the test needs the emulator's audio HAL.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          working-directory: android
          script: bash scripts/diag.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/diag" ; bash scripts/e2e.sh emulator-5554 ; bash scripts/screens.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/screens" ; cp /tmp/e2e_results.txt /tmp/e2e_eqspike.log /tmp/e2e_eqspike_full.log "$GITHUB_WORKSPACE/e2e-out/" || true
      - name: Results
        if: always()
        run: |
          cat e2e-out/e2e_results.txt || { echo "no results"; exit 1; }
          ! grep -q '^FAIL' e2e-out/e2e_results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          if-no-files-found: warn
          path: e2e-out/

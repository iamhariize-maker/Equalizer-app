name: CI
on:
  push:
  pull_request:

# Read-only token: CI only builds, tests and uploads artifacts.
permissions:
  contents: read

# Reproducible emulator package; a moving SDK archive failed before API 36 boot.
env:
  SVAN_EMULATOR_BUILD: '16428233' # Android Emulator 37.2.12

# Keep each frozen revision's evidence while an infrastructure retry runs.
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (Release)
        run: |
          cmake -S core -B build/core
          cmake --build build/core -j
          ./build/core/eqcore_tests
      - name: Policy rule matrix is generated from the registry
        run: ./build/core/eqcore_policy_doc | diff -u docs/audio-quality/POLICY_RULES.md -
      - name: Test with ASan + UBSan
        run: |
          cmake -S core -B build/asan -DEQCORE_SANITIZE=address,undefined -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/asan -j
          ./build/asan/eqcore_tests
      - name: Test with TSan (threaded parameter updates)
        run: |
          cmake -S core -B build/tsan -DEQCORE_SANITIZE=thread -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/tsan -j
          ./build/tsan/eqcore_tests eq_parameter
      - name: Mastering-reference tooling tests (numpy)
        run: |
          python3 -m pip install --quiet numpy
          python3 -W ignore tools/mastering/test_mastering.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Assemble debug APK, lint, unit tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug testDebugUnitTest
      - name: Test screenshot and control assertions
        working-directory: android
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Prepare phone preview
        run: |
          mkdir -p android/build-kit
          cp android/app/build/outputs/apk/release/app-release.apk android/build-kit/Svan-preview.apk
      - name: APK install sanity (manifest, signature, alignment)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=android/build-kit/Svan-preview.apk
          "$BT/aapt2" dump badging "$APK" > badging.txt
          "$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml > manifest.txt
          python3 android/scripts/check_manifest_permissions.py manifest.txt
          grep -E "^package|sdkVersion|native-code" badging.txt
          ! grep -q testOnly badging.txt
          ! grep -q "application-debuggable" badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee sig.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" sig.txt
          # The fixed preview key keeps updates installable over earlier previews.
          grep -q "CN=Svan Preview" sig.txt
          "$BT/zipalign" -c -P 16 4 "$APK"
          python3 android/scripts/check_native_alignment.py "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Svan-preview
          path: android/build-kit/Svan-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify production APK and Play bundle with a disposable CI key
        working-directory: android
        env:
          SVAN_KEYSTORE: ${{ runner.temp }}/svan-ci-only.p12
          SVAN_STORE_PASSWORD: ci-test-only-password
          SVAN_KEY_ALIAS: ci-test-only
          SVAN_KEY_PASSWORD: ci-test-only-password
        run: |
          keytool -genkeypair -keystore "$SVAN_KEYSTORE" -storetype PKCS12 -alias "$SVAN_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Svan CI Test Only' -storepass:env SVAN_STORE_PASSWORD -keypass:env SVAN_KEY_PASSWORD
          ./gradlew --no-daemon -PsvanProduction=true :app:assembleRelease :app:bundleRelease
          mkdir -p build-kit/production-test
          cp app/build/outputs/apk/release/app-release.apk build-kit/production-test/Svan-production-test.apk
          cp app/build/outputs/bundle/release/app-release.aab build-kit/production-test/Svan-production-test.aab
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose build-kit/production-test/Svan-production-test.apk
          "$BT/aapt2" dump xmltree build-kit/production-test/Svan-production-test.apk --file AndroidManifest.xml > production-manifest.txt
          python3 scripts/check_manifest_permissions.py production-manifest.txt
          jarsigner -verify build-kit/production-test/Svan-production-test.aab
          "$BT/zipalign" -c -P 16 4 build-kit/production-test/Svan-production-test.apk
          python3 scripts/check_native_alignment.py build-kit/production-test/Svan-production-test.apk build-kit/production-test/Svan-production-test.aab
          rm "$SVAN_KEYSTORE"
      - name: Release verifier accepts fixture and rejects wrong certificate and added permission
        working-directory: android
        run: |
          bash -n scripts/verify_release.sh scripts/test_verify_release.sh
          if command -v shellcheck >/dev/null; then
            shellcheck scripts/verify_release.sh scripts/test_verify_release.sh
          fi
          export SVAN_BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          bash scripts/test_verify_release.sh build-kit/production-test/Svan-production-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Svan-production-test-build
          path: android/build-kit/production-test/

  efficiency-ui:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: tested-debug
      - name: Observe UI lifecycle and idle scheduling
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          emulator-build: '16428233'
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -memory 3072 -cores 2 -no-snapshot -no-boot-anim -no-audio -camera-back none
          script: |
            export PATH="$GITHUB_WORKSPACE/tools/ci:$PATH"
            adb -s emulator-5554 install -r tested-debug/app-debug.apk
            python3 android/scripts/efficiency.py emulator-5554 efficiency-out
      - name: Results
        if: always()
        run: |
          cat efficiency-out/results.txt
          test "$(grep -c '^PASS' efficiency-out/results.txt)" -eq 10
          ! grep -q '^FAIL' efficiency-out/results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: efficiency-api${{ matrix.api }}
          path: efficiency-out/

  appearance-ui:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: tested-debug
      - uses: actions/download-artifact@v4
        with:
          name: Svan-production-test-build
          path: tested-production
      - name: Capture all native themes and exercise large text
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          emulator-build: ${{ env.SVAN_EMULATOR_BUILD }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -memory 3072 -cores 2 -no-snapshot -no-boot-anim -no-audio -camera-back none
          script: |
            export PATH="$GITHUB_WORKSPACE/tools/ci:$PATH"
            adb install tested-debug/app-debug.apk
            python3 android/scripts/appearance_ui.py emulator-5554 appearance-out/debug
            adb uninstall app.svan
            adb install tested-production/Svan-production-test.apk
            python3 android/scripts/appearance_ui.py emulator-5554 appearance-out/production --production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appearance-ui-api34
          path: appearance-out/

  # End-to-end routing test on a KVM-accelerated emulator (GitHub's Linux
  # runners expose /dev/kvm). Results + screenshots are uploaded as artifacts
  # and the results table is printed in the log.
  emulator-e2e:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug :testsource:assembleCapturableDebug :testsource:assembleBlockedDebug
      - name: Download the phone preview for release validation
        uses: actions/download-artifact@v4
        with:
          name: Svan-preview
          path: tested-preview
      - name: Use the exact downloadable APK in release tests
        run: |
          mkdir -p android/app/build/outputs/apk/release
          cp tested-preview/Svan-preview.apk android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/download-artifact@v4
        with:
          name: Svan-production-test-build
          path: tested-production
      - name: Prepare output dir
        run: |
          mkdir -p e2e-out
          curl -fL --retry 3 https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk -o shizuku.apk
          echo '6e273ab0e991c4e79bc8b1bbb9b9dd739ccac1a8712a541a214078886b7b790f  shizuku.apk' | sha256sum -c -
      - name: Verify emulator host audio measurement
        run: |
          python3 -m unittest discover -s android/scripts -p test_host_audio_level.py
      - name: Run e2e on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SHIZUKU_APK: ${{ github.workspace }}/shizuku.apk
          SVAN_ONBOARDING_OUT: ${{ github.workspace }}/e2e-out/onboarding
          QEMU_AUDIO_DRV: wav
          QEMU_WAV_PATH: /tmp/svan-emulator-output.wav
          QEMU_WAV_FREQUENCY: '48000'
          QEMU_WAV_DAC_FIXED_CHANNELS: '2'
          QEMU_WAV_FORMAT: s16
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          emulator-build: ${{ env.SVAN_EMULATOR_BUILD }}
          disable-animations: true
          # No -noaudio: the test needs the emulator's audio HAL.
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -memory 3072 -cores 2 -no-snapshot -no-boot-anim -camera-back none
          working-directory: android
          script: export PATH="$GITHUB_WORKSPACE/tools/ci:$PATH" ; bash scripts/detection_release.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/detection" ; bash scripts/quality_lab.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/quality" || exit 1 ; bash scripts/smoke_release.sh emulator-5554 > "$GITHUB_WORKSPACE/e2e-out/smoke.txt" 2>&1 ; bash scripts/diag.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/diag" ; bash scripts/precision_controls.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/precision" || exit 1 ; bash scripts/e2e.sh emulator-5554 ; bash scripts/source_filter.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/source-filter" || exit 1 ; bash scripts/eq_workspace.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/workspace" ; bash scripts/screens.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/screens" ; cp /tmp/e2e_results.txt /tmp/e2e_eqspike.log /tmp/e2e_eqspike_full.log "$GITHUB_WORKSPACE/e2e-out/" ; bash scripts/recording_mode.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/recording" || exit 1 ; bash scripts/basic_detection.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/basic-detection" || exit 1 ; python3 scripts/capture_recovery.py emulator-5554 "$GITHUB_WORKSPACE/e2e-out/capture-recovery" || exit 1 ; python3 scripts/diagnostic_lab.py emulator-5554 "$GITHUB_WORKSPACE/e2e-out/diagnostic" || exit 1 ; bash scripts/production_release.sh emulator-5554 "$GITHUB_WORKSPACE/tested-production/Svan-production-test.apk" "$GITHUB_WORKSPACE/e2e-out/production" || exit 1 ; python3 scripts/system_effects_lab.py emulator-5554 "$GITHUB_WORKSPACE/e2e-out/effects-lab" || echo "system effects lab did not complete (research measurement; not a gate)"
      - name: Results
        if: always()
        run: |
          cat e2e-out/smoke.txt || echo "no smoke output"
          cat e2e-out/e2e_results.txt || { echo "no results"; exit 1; }
          grep -q '^PASS release smoke test' e2e-out/smoke.txt
          if grep -q '^FAIL' e2e-out/e2e_results.txt; then echo 'e2e results contain a failure'; exit 1; fi
          grep -q '^PASS sound scroll preserves EQ settings' e2e-out/screens/interaction.txt
          test "$(grep -c '^PASS setup fixture ' e2e-out/screens/interaction.txt)" -eq 15
          ! grep -q '^FAIL' e2e-out/screens/interaction.txt
          cat e2e-out/recording/results.txt
          test "$(grep -c '^PASS' e2e-out/recording/results.txt)" -eq 7
          ! grep -q '^FAIL' e2e-out/recording/results.txt
          cat e2e-out/basic-detection/results.txt
          test "$(grep -c '^PASS' e2e-out/basic-detection/results.txt)" -eq 14
          ! grep -q '^FAIL' e2e-out/basic-detection/results.txt
          cat e2e-out/capture-recovery/results.txt
          test "$(grep -c '^PASS' e2e-out/capture-recovery/results.txt)" -eq 14
          ! grep -q '^FAIL' e2e-out/capture-recovery/results.txt
          cat e2e-out/diagnostic/results.txt
          test "$(grep -c '^PASS' e2e-out/diagnostic/results.txt)" -eq 8
          ! grep -q '^FAIL' e2e-out/diagnostic/results.txt
          cat e2e-out/workspace/results.txt
          if grep -q '^FAIL' e2e-out/workspace/results.txt; then exit 1; fi
          test "$(grep -c '^PASS' e2e-out/workspace/results.txt)" -eq 9
          cat e2e-out/precision/results.txt
          if grep -q '^FAIL' e2e-out/precision/results.txt; then exit 1; fi
          test "$(grep -c '^PASS' e2e-out/precision/results.txt)" -eq 8
          cat e2e-out/source-filter/results.txt
          test "$(grep -c '^PASS' e2e-out/source-filter/results.txt)" -eq 3
          ! grep -q '^FAIL' e2e-out/source-filter/results.txt
          cat e2e-out/quality/continuity/results.txt
          test "$(grep -c '^PASS' e2e-out/quality/continuity/results.txt)" -eq 4
          ! grep -q '^FAIL' e2e-out/quality/continuity/results.txt
          cat e2e-out/quality/results.txt
          if grep -q '^FAIL' e2e-out/quality/results.txt; then exit 1; fi
          test "$(grep -c '^PASS' e2e-out/quality/results.txt)" -eq 4
          cat e2e-out/production/results.txt
          test "$(grep -c '^PASS' e2e-out/production/results.txt)" -eq 8
          ! grep -q '^FAIL' e2e-out/production/results.txt
          cat e2e-out/detection/detection.txt
          if grep -q '^FAIL' e2e-out/detection/detection.txt; then echo 'release detection results contain a failure'; exit 1; fi
          test "$(grep -c '^PASS' e2e-out/detection/detection.txt)" -eq 13
          cat e2e-out/onboarding/results.txt
          test "$(grep -c '^PASS' e2e-out/onboarding/results.txt)" -eq 8
          ! grep -q '^FAIL' e2e-out/onboarding/results.txt
          cat e2e-out/onboarding/fallbacks/results.txt
          test "$(grep -c '^PASS' e2e-out/onboarding/fallbacks/results.txt)" -eq 3
          ! grep -q '^FAIL' e2e-out/onboarding/fallbacks/results.txt
          cat e2e-out/detection/onboarding.txt
          test "$(grep -c '^PASS' e2e-out/detection/onboarding.txt)" -eq 6
          ! grep -q '^FAIL' e2e-out/detection/onboarding.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-api${{ matrix.api }}
          if-no-files-found: warn
          path: e2e-out/

  # Fast feedback for the new connection path; the full e2e job still requires these same checks.
  basic-detection:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test players
        working-directory: android
        run: ./gradlew --no-daemon :testsource:assembleCapturableDebug :testsource:assembleBlockedDebug
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: tested-debug
      - name: Verify emulator host audio measurement
        run: |
          python3 -m unittest discover -s android/scripts -p test_host_audio_level.py
          mkdir -p basic-out
      - name: Exercise DUMP-free connections and measure processed host output
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QEMU_AUDIO_DRV: wav
          QEMU_WAV_PATH: /tmp/svan-emulator-output.wav
          QEMU_WAV_FREQUENCY: '48000'
          QEMU_WAV_DAC_FIXED_CHANNELS: '2'
          QEMU_WAV_FORMAT: s16
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          emulator-build: ${{ env.SVAN_EMULATOR_BUILD }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -memory 3072 -cores 2 -no-snapshot -no-boot-anim -camera-back none
          working-directory: android
          script: export PATH="$GITHUB_WORKSPACE/tools/ci:$PATH" ; adb -s emulator-5554 install -r "$GITHUB_WORKSPACE/tested-debug/app-debug.apk" ; adb -s emulator-5554 install -r testsource/build/outputs/apk/capturable/debug/testsource-capturable-debug.apk ; adb -s emulator-5554 install -r testsource/build/outputs/apk/blocked/debug/testsource-blocked-debug.apk ; adb -s emulator-5554 shell wm size 320x640 ; adb -s emulator-5554 shell wm density 160 ; bash scripts/basic_detection.sh emulator-5554 "$GITHUB_WORKSPACE/basic-out" || exit 1 ; python3 scripts/capture_recovery.py emulator-5554 "$GITHUB_WORKSPACE/basic-out/capture-recovery" || exit 1 ; python3 scripts/integrated_lab.py emulator-5554 "$GITHUB_WORKSPACE/basic-out/integrated-lab"
      - name: Results
        if: always()
        run: |
          cat basic-out/results.txt
          test "$(grep -c '^PASS' basic-out/results.txt)" -eq 14
          ! grep -q '^FAIL' basic-out/results.txt
          cat basic-out/capture-recovery/results.txt
          test "$(grep -c '^PASS' basic-out/capture-recovery/results.txt)" -eq 14
          ! grep -q '^FAIL' basic-out/capture-recovery/results.txt
          cat basic-out/integrated-lab/results.txt
          test "$(grep -c '^PASS' basic-out/integrated-lab/results.txt)" -eq 7
          ! grep -q '^FAIL' basic-out/integrated-lab/results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basic-detection-api${{ matrix.api }}
          path: basic-out/

  # Install + launch the release APK on several Android versions (the user's phones run 10-15 and
  # vendor skins on top). Emulators cannot reproduce OEM skins; this catches OS-version breakage.
  compat:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 29, target: default }
          - { api: 30, target: default }
          - { api: 33, target: default }
          - { api: 35, target: default }
          - { api: 36, target: google_apis }
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: Svan-preview
          path: tested-preview
      - run: |
          mkdir -p android/app/build/outputs/apk/release e2e-out
          cp tested-preview/Svan-preview.apk android/app/build/outputs/apk/release/app-release.apk
      - name: Install and smoke test on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # The hosted runner has no PulseAudio server. Use the same working
          # backend as routing checks instead of an uninitialised host device.
          QEMU_AUDIO_DRV: wav
          QEMU_WAV_PATH: /tmp/svan-compat-output.wav
          QEMU_WAV_FREQUENCY: '48000'
          QEMU_WAV_DAC_FIXED_CHANNELS: '2'
          QEMU_WAV_FORMAT: s16
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-build: ${{ env.SVAN_EMULATOR_BUILD }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -memory 3072 -cores 2 -no-snapshot -no-boot-anim -camera-back none
          working-directory: android
          script: export PATH="$GITHUB_WORKSPACE/tools/ci:$PATH" ; bash scripts/smoke_release.sh emulator-5554 > "$GITHUB_WORKSPACE/e2e-out/smoke.txt" 2>&1 ; adb logcat -d > "$GITHUB_WORKSPACE/e2e-out/logcat.txt" ; adb shell getprop ro.build.version.release > "$GITHUB_WORKSPACE/e2e-out/android.txt"
      - name: Result
        if: always()
        run: |
          echo "Android $(cat e2e-out/android.txt 2>/dev/null) (API ${{ matrix.api }})"
          cat e2e-out/smoke.txt
          grep -q '^PASS release smoke test' e2e-out/smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-api${{ matrix.api }}
          path: e2e-out/

  capture-lab:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test players
        working-directory: android
        run: ./gradlew --no-daemon :testsource:assembleCapturableDebug :testsource:assembleBlockedDebug
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: tested-debug
      - name: Verify emulator host audio measurement
        run: |
          python3 -m unittest discover -s android/scripts -p test_host_audio_level.py
          mkdir -p capture-lab-out
      - name: Exercise native Capture Lab and measure processed host output
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QEMU_AUDIO_DRV: wav
          QEMU_WAV_PATH: /tmp/svan-emulator-output.wav
          QEMU_WAV_FREQUENCY: '48000'
          QEMU_WAV_DAC_FIXED_CHANNELS: '2'
          QEMU_WAV_FORMAT: s16
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          emulator-build: ${{ env.SVAN_EMULATOR_BUILD }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -memory 3072 -cores 2 -no-snapshot -no-boot-anim -camera-back none
          working-directory: android
          script: export PATH="$GITHUB_WORKSPACE/tools/ci:$PATH" ; adb -s emulator-5554 install -r "$GITHUB_WORKSPACE/tested-debug/app-debug.apk" ; adb -s emulator-5554 install -r testsource/build/outputs/apk/capturable/debug/testsource-capturable-debug.apk ; adb -s emulator-5554 install -r testsource/build/outputs/apk/blocked/debug/testsource-blocked-debug.apk ; adb -s emulator-5554 shell wm size 320x640 ; adb -s emulator-5554 shell wm density 160 ; python3 scripts/capture_lab.py emulator-5554 "$GITHUB_WORKSPACE/capture-lab-out"
      - name: Results
        if: always()
        run: |
          cat capture-lab-out/results.txt
          test "$(grep -c '^PASS' capture-lab-out/results.txt)" -eq 7
          ! grep -q '^FAIL' capture-lab-out/results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-lab-api${{ matrix.api }}
          path: capture-lab-out/


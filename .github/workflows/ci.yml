name: CI
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (Release)
        run: |
          cmake -S core -B build/core
          cmake --build build/core -j
          ./build/core/eqcore_tests
      - name: Test with ASan + UBSan
        run: |
          cmake -S core -B build/asan -DEQCORE_SANITIZE=address,undefined -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/asan -j
          ./build/asan/eqcore_tests
      - name: Test with TSan (threaded parameter updates)
        run: |
          cmake -S core -B build/tsan -DEQCORE_SANITIZE=thread -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/tsan -j
          ./build/tsan/eqcore_tests eq_parameter

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Assemble debug APK, lint, unit tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug testDebugUnitTest
      - name: Prepare phone preview
        run: |
          mkdir -p android/build-kit
          cp android/app/build/outputs/apk/release/app-release.apk android/build-kit/Svan-preview.apk
      - name: APK install sanity (manifest, signature, alignment)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=android/build-kit/Svan-preview.apk
          "$BT/aapt2" dump badging "$APK" > badging.txt
          "$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml > manifest.txt
          python3 android/scripts/check_manifest_permissions.py manifest.txt
          grep -E "^package|sdkVersion|native-code" badging.txt
          ! grep -q testOnly badging.txt
          ! grep -q "application-debuggable" badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee sig.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" sig.txt
          # The fixed preview key keeps updates installable over earlier previews.
          grep -q "CN=Svan Preview" sig.txt
          python3 - "$APK" <<'PY'
          import struct, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1]); f = open(sys.argv[1], 'rb')
          for i in z.infolist():
              if i.filename.endswith('.so') and i.compress_type == 0:
                  f.seek(i.header_offset); h = f.read(30)
                  n, e = struct.unpack('<HH', h[26:30])
                  assert (i.header_offset + 30 + n + e) % 4096 == 0, 'unaligned ' + i.filename
          print('native libs page-aligned')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Svan-preview
          path: android/build-kit/Svan-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # End-to-end routing test on a KVM-accelerated emulator (GitHub's Linux
  # runners expose /dev/kvm). Results + screenshots are uploaded as artifacts
  # and the results table is printed in the log.
  emulator-e2e:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug :testsource:assembleCapturableDebug :testsource:assembleBlockedDebug
      - name: Download the phone preview for release validation
        uses: actions/download-artifact@v4
        with:
          name: Svan-preview
          path: tested-preview
      - name: Use the exact downloadable APK in release tests
        run: |
          mkdir -p android/app/build/outputs/apk/release
          cp tested-preview/Svan-preview.apk android/app/build/outputs/apk/release/app-release.apk
      - name: Prepare output dir
        run: |
          mkdir -p e2e-out
          curl -fL --retry 3 https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk -o shizuku.apk
          echo '6e273ab0e991c4e79bc8b1bbb9b9dd739ccac1a8712a541a214078886b7b790f  shizuku.apk' | sha256sum -c -
      - name: Run e2e on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SHIZUKU_APK: ${{ github.workspace }}/shizuku.apk
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          # No -noaudio: the test needs the emulator's audio HAL.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          working-directory: android
          script: bash scripts/detection_release.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/detection" ; bash scripts/smoke_release.sh emulator-5554 > "$GITHUB_WORKSPACE/e2e-out/smoke.txt" 2>&1 ; bash scripts/diag.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/diag" ; bash scripts/precision_controls.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/precision" || exit 1 ; bash scripts/e2e.sh emulator-5554 ; bash scripts/eq_workspace.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/workspace" ; bash scripts/screens.sh emulator-5554 "$GITHUB_WORKSPACE/e2e-out/screens" ; cp /tmp/e2e_results.txt /tmp/e2e_eqspike.log /tmp/e2e_eqspike_full.log "$GITHUB_WORKSPACE/e2e-out/" || true
      - name: Results
        if: always()
        run: |
          cat e2e-out/smoke.txt || echo "no smoke output"
          cat e2e-out/e2e_results.txt || { echo "no results"; exit 1; }
          grep -q '^PASS release smoke test' e2e-out/smoke.txt
          if grep -q '^FAIL' e2e-out/e2e_results.txt; then echo 'e2e results contain a failure'; exit 1; fi
          grep -q '^PASS sound scroll preserves EQ settings' e2e-out/screens/interaction.txt
          cat e2e-out/workspace/results.txt
          if grep -q '^FAIL' e2e-out/workspace/results.txt; then exit 1; fi
          test "$(grep -c '^PASS' e2e-out/workspace/results.txt)" -eq 9
          cat e2e-out/precision/results.txt
          if grep -q '^FAIL' e2e-out/precision/results.txt; then exit 1; fi
          test "$(grep -c '^PASS' e2e-out/precision/results.txt)" -eq 8
          cat e2e-out/detection/detection.txt
          if grep -q '^FAIL' e2e-out/detection/detection.txt; then echo 'release detection results contain a failure'; exit 1; fi
          test "$(grep -c '^PASS' e2e-out/detection/detection.txt)" -eq 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          if-no-files-found: warn
          path: e2e-out/

  # Install + launch the release APK on several Android versions (the user's phones run 10-15 and
  # vendor skins on top). Emulators cannot reproduce OEM skins; this catches OS-version breakage.
  compat:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30, 33, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: Svan-preview
          path: tested-preview
      - run: |
          mkdir -p android/app/build/outputs/apk/release e2e-out
          cp tested-preview/Svan-preview.apk android/app/build/outputs/apk/release/app-release.apk
      - name: Install and smoke test on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          working-directory: android
          script: bash scripts/smoke_release.sh emulator-5554 > "$GITHUB_WORKSPACE/e2e-out/smoke.txt" 2>&1 ; adb logcat -d > "$GITHUB_WORKSPACE/e2e-out/logcat.txt" ; adb shell getprop ro.build.version.release > "$GITHUB_WORKSPACE/e2e-out/android.txt"
      - name: Result
        if: always()
        run: |
          echo "Android $(cat e2e-out/android.txt 2>/dev/null) (API ${{ matrix.api }})"
          cat e2e-out/smoke.txt
          grep -q '^PASS release smoke test' e2e-out/smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-api${{ matrix.api }}
          path: e2e-out/

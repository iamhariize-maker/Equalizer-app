name: Frozen APK integrated Lab validation
on:
  push:
    branches: [ccr-48b03ead-4py4vd]
    paths:
      - .github/workflows/lab-validation.yml
      - android/scripts/integrated_lab.py
  workflow_dispatch:
    inputs:
      payload_run:
        description: CI run containing the unchanged app-debug artifact
        required: true
        default: '38043767633'
      payload_sha:
        description: Full source commit of that artifact
        required: true
        default: '88a230e874b663566c5391814d299d796b77cb3b'
permissions:
  contents: read
  actions: read
jobs:
  integrated-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34]
    steps:
      - uses: actions/checkout@v4
      - name: Confirm artifact source and unchanged application
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_RUN: ${{ inputs.payload_run || '38043767633' }}
          PAYLOAD_SHA: ${{ inputs.payload_sha || '88a230e874b663566c5391814d299d796b77cb3b' }}
        run: |
          [[ "$PAYLOAD_RUN" =~ ^[0-9]+$ ]]
          [[ "$PAYLOAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PAYLOAD_RUN" --jq .head_sha)
          test "$actual" = "$PAYLOAD_SHA"
          git fetch --depth=1 origin "$PAYLOAD_SHA"
          git diff --exit-code "$PAYLOAD_SHA" HEAD -- core android/app android/gradle android/build.gradle.kts android/settings.gradle.kts android/gradle.properties android/testsource
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: tested-debug
          github-token: ${{ github.token }}
          run-id: ${{ inputs.payload_run || '38043767633' }}
      - name: Build unchanged test players
        working-directory: android
        run: ./gradlew --no-daemon :testsource:assembleCapturableDebug :testsource:assembleBlockedDebug
      - name: DUMP-free Lab transitions and native UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          emulator-build: '16428233'
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -memory 3072 -cores 2 -no-snapshot -no-boot-anim -no-audio -camera-back none
          script: |
            export PATH="$GITHUB_WORKSPACE/tools/ci:$PATH"
            adb -s emulator-5554 install -r tested-debug/app-debug.apk
            adb -s emulator-5554 install -r android/testsource/build/outputs/apk/capturable/debug/testsource-capturable-debug.apk
            adb -s emulator-5554 install -r android/testsource/build/outputs/apk/blocked/debug/testsource-blocked-debug.apk
            python3 android/scripts/integrated_lab.py emulator-5554 integrated-out
      - name: Results
        if: always()
        run: |
          cat integrated-out/results.txt
          test "$(grep -c '^PASS' integrated-out/results.txt)" -eq 7
          ! grep -q '^FAIL' integrated-out/results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-validation-api${{ matrix.api }}
          path: integrated-out/
